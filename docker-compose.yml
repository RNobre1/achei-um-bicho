services:
  banco:
    # a imagem oficial do PostGIS só é publicada para amd64; em Mac com chip
    # Apple ela roda emulada, o que é suficiente para desenvolvimento
    image: postgis/postgis:16-3.5
    platform: linux/amd64
    container_name: achei-um-bicho-banco
    environment:
      POSTGRES_USER: bicho
      POSTGRES_PASSWORD: bicho
      POSTGRES_DB: achei_um_bicho
    ports:
      - "5432:5432"
    volumes:
      - banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bicho -d achei_um_bicho"]
      interval: 5s
      timeout: 3s
      retries: 20

  # a API em contêiner, para quem só quer rodar o sistema e para o deploy; no dia a
  # dia a API roda direto com pnpm, e este serviço fica fora do "up" padrão
  api:
    profiles: ["completo"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: achei-um-bicho-api
    container_name: achei-um-bicho-api
    environment:
      DATABASE_URL: postgresql://bicho:bicho@banco:5432/achei_um_bicho
      PORT: "3333"
      CORS_ORIGINS: http://localhost:8081
      RAIO_PADRAO_METROS: "1600"
    ports:
      - "3333:3333"
    depends_on:
      banco:
        condition: service_healthy

volumes:
  banco:
